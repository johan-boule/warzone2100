name: Ubuntu

on:
  push:
  pull_request:
  release:

jobs:
  ubuntu-build:
    strategy:
      matrix:
        include:
          - name: "Ubuntu 24.04 [GCC]"
            docker: "ubuntu-24.04"
            arch: "amd64"
            output-suffix: "ubuntu24.04"
            compiler: gcc
            publish_artifact: true
            deploy_release: true
      fail-fast: true
    name: '${{ matrix.name }}'
    permissions:
      contents: write # Needed to upload to releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: 'src'
      - name: git submodule
        run: git -C $GITHUB_WORKSPACE/src submodule update --init --recursive
      - name: docker build
        run: docker build --build-arg UID=$UID -f $GITHUB_WORKSPACE/src/docker/${{ matrix.docker }}/Dockerfile -t ubuntu $GITHUB_WORKSPACE/src
      - name: export env
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            WZ_BUILD_DESC_IS_TAG=true
          else
            WZ_BUILD_DESC_IS_TAG=false
          fi
          echo WZ_BUILD_DESC_IS_TAG=$WZ_BUILD_DESC_IS_TAG >> $GITHUB_ENV

          if [[ -v GITHUB_HEAD_REF ]]; then
            WZ_BUILD_DESC_PREFIX=$GITHUB_HEAD_REF
          else
            WZ_BUILD_DESC_PREFIX=$GITHUB_REF_NAME
          fi
          WZ_BUILD_DESC_PREFIX=${WZ_BUILD_DESC_PREFIX////_}
          WZ_BUILD_DESC_PREFIX=${WZ_BUILD_DESC_PREFIX//-/_}
          echo WZ_BUILD_DESC_PREFIX=$WZ_BUILD_DESC_PREFIX >> $GITHUB_ENV

          WZ_OUTPUT_NAME_SUFFIX=""
          WZ_NAME_SUFFIX=""
          if [[ $GITHUB_REF_TYPE != tag ]]; then
            suffix=$(sed 's/[^a-zA-Z0-9\.]/_/g' <<< "$WZ_BUILD_DESC_PREFIX")
            echo WZ_OUTPUT_NAME_SUFFIX=_$suffix >> $GITHUB_ENV
            echo WZ_NAME_SUFFIX=" ($suffix)" >> $GITHUB_ENV
          fi

          echo WZ_DISTRIBUTOR=${GITHUB_REPOSITORY%/*} >> $GITHUB_ENV

          case ${{ matrix.compiler }} in
            (gcc)
              echo CC=/usr/bin/gcc
              echo CXX=/usr/bin/g++
            ;;
            (clang)
              echo CC=/usr/bin/clang
              echo CXX=/usr/bin/clang++
            ;;
          esac >> $GITHUB_ENV
      - name: CMake Configure
        run: |
          echo "::add-matcher::$GITHUB_WORKSPACE/src/.ci/githubactions/pattern_matchers/cmake.json"
          docker run --rm \
            --env CI \
            --env GITHUB_WORKFLOW --env GITHUB_ACTIONS --env GITHUB_REPOSITORY --env GITHUB_WORKSPACE \
            --env GITHUB_SHA --env GITHUB_REF --env GITHUB_HEAD_REF --env GITHUB_BASE_REF \
            --env CC --env CXX \
            --volume $GITHUB_WORKSPACE:$GITHUB_WORKSPACE \
            ubuntu \
              cmake \
                -G Ninja \
                -S $GITHUB_WORKSPACE/src
                -B $GITHUB_WORKSPACE/build
                -D CMAKE_BUILD_TYPE=Release \
                -D WZ_OUTPUT_NAME_SUFFIX="$WZ_OUTPUT_NAME_SUFFIX" \
                -D WZ_NAME_SUFFIX="$WZ_NAME_SUFFIX" \
                -D WZ_DISTRIBUTOR="$WZ_DISTRIBUTOR" \
                -D WZ_ENABLE_WARNINGS=0 \
                -D WZ_BUILD_SENTRY=0 \
                -D ENABLE_DISCORD=0 \
                -D ENABLE_GNS_NETWORK_BACKEND=0
          echo '::remove-matcher owner=cmake::'
      - name: CMake Build
        run: |
          echo "::add-matcher::$GITHUB_WORKSPACE/src/.ci/githubactions/pattern_matchers/${{ matrix.compiler }}.json"
          docker run --rm \
            --env CI \
            --env GITHUB_WORKFLOW --env GITHUB_ACTIONS --env GITHUB_REPOSITORY --env GITHUB_WORKSPACE \
            --env GITHUB_SHA --env GITHUB_REF --env GITHUB_HEAD_REF --env GITHUB_BASE_REF \
            --env CC --env CXX \
            --volume $GITHUB_WORKSPACE:$GITHUB_WORKSPACE \
            ubuntu \
              cmake --build $GITHUB_WORKSPACE/build
          echo '::remove-matcher owner=${{ matrix.compiler }}::'
      - name: CPack Debian
        working-directory: '${{ github.workspace }}/build'
        run: |
          docker run --rm \
            --env CI \
            --env GITHUB_WORKFLOW --env GITHUB_ACTIONS --env GITHUB_REPOSITORY --env GITHUB_WORKSPACE \
            --env GITHUB_SHA --env GITHUB_REF --env GITHUB_HEAD_REF --env GITHUB_BASE_REF \
            --volume $GITHUB_WORKSPACE:$GITHUB_WORKSPACE \
            --workdir $PWD \
            ubuntu \
              cpack \
                --config ./CPackConfig.cmake \
                -G DEB \
                -D CPACK_DEBIAN_PACKAGE_MAINTAINER="$WZ_DISTRIBUTOR" \
                -D CPACK_DEB_COMPONENT_INSTALL=ON \
                -D CPACK_COMPONENTS_GROUPING=ALL_COMPONENTS_IN_ONE \
                -D CPACK_DEBIAN_PACKAGE_NAME="warzone2100$(sed 's/[^a-zA-Z0-9\.\+\-]/-/g' <<< "$WZ_OUTPUT_NAME_SUFFIX")" \
                -D CPACK_DEBIAN_FILE_NAME=warzone2100.deb

          OUTPUT_DIR=$HOME/output
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          mkdir --parents $OUTPUT_DIR
          OUTPUT_FILE_NAME=warzone2100_${{ matrix.output-suffix }}_${{ matrix.arch }}.deb
          mv warzone2100.deb $OUTPUT_DIR/$OUTPUT_FILE_NAME
          echo WZ_FULL_OUTPUT_DEB_PATH=$OUTPUT_DIR/$OUTPUT_FILE_NAME >> $GITHUB_ENV
      - uses: actions/upload-artifact@v6
        if: success() && (github.event_name != 'release') && (matrix.publish_artifact == true)
        with:
          name: "warzone2100_${{ matrix.output-suffix }}_${{ matrix.arch }}_deb"
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: 'error'
      - name: gh release upload
        if: success() && (github.event_name == 'release') && (matrix.deploy_release == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" $WZ_FULL_OUTPUT_DEB_PATH
